<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More rising projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto; /* Removed extra top margin */
            padding: 5px;   /* Thinner padding */
            background-color: #ffffff;
            color: #333;
        }
        
        .widget-container {
            background-color: #f5f5f5;
            padding: 5px; /* Much smaller padding inside the gray box */
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 8px; /* DRASTICALLY reduced the distance between the gray boxes */
            text-align: center;
        }
        
        h3 {
            margin: 2px 0 5px 0; /* Less empty space around your titles */
            font-size: 15px;     /* Made the title text slightly smaller */
        }

        .crop-box {
            width: 320px;
            height: 105px; /* Much shorter box! */
            margin: 0 auto; 
            overflow: hidden; 
        }

        .counter-frame {
            width: 320px;
            height: 300px; 
            border: none;
            margin-top: -25px; /* THE MAGIC TRICK: Pulls the widget UP to hide the blank space at the top */
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <h3>@fifty.410</h3>
        <div class="crop-box">
            <iframe scrolling="no" class="counter-frame" src="https://livecounts.io/embed/tiktok-live-follower-counter/fifty.410"></iframe>
        </div>
    </div>

    <div class="widget-container">
        <h3>@glp1newsnow</h3>
        <div class="crop-box">
            <iframe scrolling="no" class="counter-frame" src="https://livecounts.io/embed/tiktok-live-follower-counter/glp1newsnow"></iframe>
        </div>
    </div>

    <div class="widget-container">
        <h3>@phdlifehacks</h3>
        <div class="crop-box">
            <iframe scrolling="no" class="counter-frame" src="https://livecounts.io/embed/tiktok-live-follower-counter/phdlifehacks"></iframe>
        </div>
    </div>
</body>
</html>
